name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - debug
          - profile
          - release
      output_type:
        description: Output type
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle
          - apk-split

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: |
          for i in 1 2 3; do
            flutter pub get && exit 0
            echo "Pub get failed, retry $i/3"
            sleep 15
          done
          exit 1

      - name: Create Android Platform
        run: flutter create --platforms android --org com.alaa --project-name hosting .

      - name: Configure Android Groovy Build
        shell: bash
        run: |
          set -e

          rm -f android/settings.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts

          cat > android/settings.gradle <<'GRADLE'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream {
                      properties.load(it)
                  }
                  def path = properties.getProperty("flutter.sdk")
                  assert path != null
                  return path
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.9.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          include ":app"
          GRADLE

          cat > android/build.gradle <<'GRADLE'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GRADLE

          cat > android/app/build.gradle <<'GRADLE'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.alaa.hosting"
              compileSdk 36
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.alaa.hosting"
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE

          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

          echo "Groovy Android configuration completed"
          ls -la android
      - name: Inject Native Signature Verification
        shell: bash
        run: |
          MAIN_KT="android/app/src/main/kotlin/com/alaa/hosting/MainActivity.kt"
          mkdir -p "$(dirname "$MAIN_KT")"

          cat > "$MAIN_KT" <<'KOT'
          package com.alaa.hosting

          import android.content.pm.PackageManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.security.MessageDigest

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "hosting/security"

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getApkSignatureSha256" -> {
                              try {
                                  result.success(getApkSignatureSha256())
                              } catch (e: Exception) {
                                  result.error(
                                      "SIGNATURE_ERROR",
                                      e.message,
                                      null
                                  )
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun getApkSignatureSha256(): String {
                  val info = if (Build.VERSION.SDK_INT >= 28) {
                      packageManager.getPackageInfo(
                          packageName,
                          PackageManager.GET_SIGNING_CERTIFICATES
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      packageManager.getPackageInfo(
                          packageName,
                          PackageManager.GET_SIGNATURES
                      )
                  }

                  val signatures = if (Build.VERSION.SDK_INT >= 28) {
                      info.signingInfo?.apkContentsSigners
                  } else {
                      @Suppress("DEPRECATION")
                      info.signatures
                  }

                  val certificate = signatures?.firstOrNull()
                      ?: throw IllegalStateException("Certificate not found")

                  return MessageDigest.getInstance("SHA-256")
                      .digest(certificate.toByteArray())
                      .joinToString(":") {
                          "%02X".format(it.toInt() and 0xFF)
                      }
              }
          }
          KOT

      - name: Patch Android Manifest
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="HOST PANEL"',
              s,
              count=1
          )

          if "android.permission.INTERNET" not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              )
              s = s.replace("<application", perms + "<application", 1)

          if "usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          p.write_text(s)
          PY

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK or AAB
        shell: bash
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"

          FLAGS=(--obfuscate --split-debug-info=build/symbols)

          build_app() {
            if [ "$OUT" = "apk" ]; then
              flutter build apk --"$TYPE" "${FLAGS[@]}"
            elif [ "$OUT" = "apk-split" ]; then
              flutter build apk --"$TYPE" "${FLAGS[@]}" --split-per-abi
            else
              flutter build appbundle --"$TYPE" "${FLAGS[@]}"
            fi
          }

          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"

            if build_app; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Retrying..."
              sleep $((attempt * 20))
            fi
          done

          echo "All build attempts failed"
          exit 1

      - name: Verify Build Output
        run: |
          if [ "${{ github.event.inputs.output_type }}" = "appbundle" ]; then
            test -n "$(find build/app/outputs/bundle -name '*.aab' -print -quit)"
          else
            ls -lh build/app/outputs/flutter-apk/
            test -n "$(find build/app/outputs/flutter-apk -name '*.apk' -print -quit)"
          fi

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 7
